{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}
  Оставить отзыв
{% endblock %}

{% block page_title %}
  Оставить отзыв
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 p-5">
      <div class="card">
        <div class="card-header">
          Ваш отзыв о посещении
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Отправить отзыв</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
