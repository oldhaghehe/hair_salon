{% extends 'base.html' %}

{% block title %}
  Удаление отзыва
{% endblock %}

{% block page_title %}
  Удаление отзыва
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 p-5">
      <div class="card">
        <div class="card-header">
          Вы уверены, что хотите удалить этот отзыв?
        </div>
        <div class="card-body">
          <p>"{{ object.text }}"</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'salon:profile' user.username %}" class="btn btn-secondary">Нет, вернуться</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
